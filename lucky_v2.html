<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lucky Draw V2 Control</title>
  <script>
    if (location.protocol === 'file:') {
      location.replace('http://127.0.0.1:8000/lucky_v2.html' + location.search + location.hash);
    }
  </script>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./styles.css">
  <style>
    :root{color-scheme:dark;--bg:#080b10;--panel:#111827;--panel2:#162033;--line:#2d3a51;--text:#f8fafc;--muted:#aab6c8;--accent:#20d3c2;--gold:#ffd166;--danger:#ff5a67}
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;height:100vh;overflow:hidden;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    button,input,select{font:inherit}
    .v2-shell{display:grid;grid-template-columns:minmax(320px,420px) 1fr;height:100vh;min-height:0}
    .v2-control{height:100vh;min-height:0;padding:20px;border-right:1px solid var(--line);background:linear-gradient(180deg,#111827,#0d1422);overflow-y:auto;overflow-x:hidden}
    .v2-stage-wrap{position:relative;height:100vh;min-height:0;padding:22px;display:flex;align-items:center;justify-content:center;overflow:hidden}
    .v2-panel{border:1px solid var(--line);background:rgba(17,24,39,.9);border-radius:8px;padding:14px;margin-bottom:14px}
    .v2-title{margin:0 0 4px;font-size:26px;letter-spacing:0;font-weight:900}
    .v2-sub{margin:0;color:var(--muted)}
    .v2-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .v2-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .v2-field{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
    .v2-field span{font-size:13px;color:var(--muted)}
    .v2-field input,.v2-field select{width:100%;border:1px solid var(--line);border-radius:8px;background:#0b1220;color:var(--text);padding:10px}
    .v2-check{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:14px}
    .v2-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .v2-btn{border:1px solid var(--line);border-radius:8px;background:#1f2a3d;color:var(--text);padding:10px 12px;cursor:pointer;font-weight:800}
    .v2-btn:hover{border-color:var(--accent)}
    .v2-btn.primary{background:linear-gradient(135deg,#0f9f93,#1f7aec);border-color:transparent}
    .v2-btn.gold{background:linear-gradient(135deg,#b7791f,#f6c453);color:#111827;border-color:transparent}
    .v2-btn.danger{background:#6d1f2a;border-color:#9f2c3b}
    .v2-status{min-height:22px;color:var(--muted);font-size:14px;line-height:1.45}
    .v2-public-link{word-break:break-all;color:#8bd5ff}
    .v2-stage{position:relative;width:min(100%,1500px,calc((100vh - 44px) * 16 / 9));max-height:calc(100vh - 44px);aspect-ratio:16/9;border:1px solid rgba(255,255,255,.16);border-radius:8px;overflow:hidden;background:#090d14;box-shadow:0 30px 90px rgba(0,0,0,.45)}
    .v2-stage-bg{position:absolute;inset:0;background-size:cover;background-position:center;filter:brightness(.75)}
    .v2-stage-dim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.15),rgba(0,0,0,.55))}
    .v2-lever{position:absolute;right:18px;top:44%;z-index:4;width:76px;height:240px;transform:translateY(-50%);pointer-events:none;perspective:420px;filter:drop-shadow(0 22px 30px rgba(0,0,0,.45))}
    .v2-lever::before{content:"";position:absolute;right:4px;top:28px;width:54px;height:190px;border-radius:22px;background:linear-gradient(90deg,#111827,#26334a 45%,#0b111d);border:1px solid rgba(255,255,255,.2);box-shadow:inset 10px 0 20px rgba(255,255,255,.08),inset -12px 0 22px rgba(0,0,0,.5)}
    .v2-lever-rail{position:absolute;right:21px;top:50px;width:24px;height:152px;border-radius:999px;background:linear-gradient(90deg,#4a2c09,#f6c453 28%,#6b3e0b 72%,#1d1307);box-shadow:inset 0 0 12px rgba(0,0,0,.72),0 12px 26px rgba(0,0,0,.38)}
    .v2-lever-rail::before{content:"";position:absolute;inset:8px 7px;border-radius:999px;background:linear-gradient(180deg,rgba(0,0,0,.86),rgba(255,255,255,.1) 48%,rgba(0,0,0,.72));box-shadow:inset 0 0 12px rgba(0,0,0,.9)}
    .v2-lever-rail::after{content:"";position:absolute;left:50%;top:14px;width:8px;height:28px;border-radius:999px;background:rgba(255,226,143,.55);transform:translateX(-50%);filter:blur(.2px)}
    .v2-lever-arm{position:absolute;right:26px;top:14px;width:16px;height:134px;border-radius:999px;background:linear-gradient(90deg,#6b7892,#eef6ff 38%,#7484a3 72%,#2f3b52);transform-origin:50% 124px;transform:translateY(0) rotate(-8deg);box-shadow:0 16px 26px rgba(0,0,0,.46)}
    .v2-lever-arm::before{content:"";position:absolute;inset:5px 4px;border-radius:999px;background:linear-gradient(180deg,rgba(255,255,255,.58),rgba(255,255,255,0) 36%)}
    .v2-lever-arm::after{content:"";position:absolute;left:50%;bottom:-16px;width:40px;height:40px;border-radius:50%;transform:translateX(-50%);background:radial-gradient(circle at 35% 30%,#fff,#9aa9c4 42%,#263248 76%);border:1px solid rgba(255,255,255,.32);box-shadow:inset -6px -8px 16px rgba(0,0,0,.42),0 10px 18px rgba(0,0,0,.44)}
    .v2-lever-knob{position:absolute;left:50%;top:-24px;width:52px;height:52px;border-radius:50%;transform:translateX(-50%);background:radial-gradient(circle at 30% 24%,#fff9df,#ffd166 34%,#df8120 68%,#7a320d 100%);box-shadow:inset -8px -12px 18px rgba(82,32,5,.45),0 0 0 2px rgba(255,255,255,.2),0 12px 30px rgba(255,209,102,.35),0 18px 26px rgba(0,0,0,.48)}
    .v2-lever-knob::after{content:"";position:absolute;left:12px;top:9px;width:16px;height:10px;border-radius:50%;background:rgba(255,255,255,.72);filter:blur(.4px)}
    .v2-lever-base{position:absolute;right:3px;bottom:0;width:62px;height:42px;border-radius:9px;background:linear-gradient(180deg,#364258,#121a29 62%,#080c14);border:1px solid rgba(255,255,255,.2);box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
    .v2-lever-base::before{content:"";position:absolute;left:10px;right:10px;top:12px;height:9px;border-radius:999px;background:linear-gradient(90deg,#0b101a,#45536a,#0b101a);box-shadow:0 14px 0 rgba(255,255,255,.12)}
    .v2-stage.is-spinning .v2-lever-arm,.v2-stage.is-lever-pull .v2-lever-arm{animation:v2LeverPull 1.7s cubic-bezier(.16,.86,.25,1) both}
    .v2-stage.is-spinning .v2-lever-knob,.v2-stage.is-lever-pull .v2-lever-knob{animation:v2LeverKnob 1.7s cubic-bezier(.16,.86,.25,1) both}
    .v2-stage.is-spinning .v2-lever,.v2-stage.is-lever-pull .v2-lever{animation:v2LeverBody 1.7s ease-out both}
    .v2-stage.is-spinning .v2-lever-rail::after,.v2-stage.is-lever-pull .v2-lever-rail::after{animation:v2LeverRailLight 1.7s ease-out both}
    .v2-stage-content{position:relative;z-index:2;height:100%;display:grid;grid-template-rows:110px minmax(0,1fr) 92px;padding:28px;gap:18px}
    .v2-stage-content>div{min-width:0}
    .v2-brand{display:grid;grid-template-columns:220px 1fr;gap:22px;align-items:center}
    .v2-logo,.v2-banner{height:100%;background-repeat:no-repeat;background-position:center}
    .v2-logo{background-size:contain}
    .v2-banner{background-size:cover;border-radius:8px}
    .v2-prize{display:flex;align-items:center;justify-content:center;text-align:center;gap:14px;font-weight:900;font-size:clamp(24px,4vw,70px);text-shadow:0 8px 30px rgba(0,0,0,.8);min-width:0;max-width:100%;white-space:nowrap;overflow:hidden}
    #v2PrizeName{display:block;min-width:0;max-width:100%;white-space:nowrap;overflow:hidden;line-height:1.05}
    .v2-mode-pill{border:1px solid rgba(255,255,255,.24);border-radius:999px;padding:8px 14px;font-size:18px;color:var(--gold);white-space:nowrap}
    .v2-gift-left{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;max-width:32%;border:1px solid rgba(255,209,102,.55);background:rgba(17,24,39,.74);border-radius:999px;padding:8px 14px;font-size:clamp(14px,1.2vw,22px);line-height:1.05;color:#ffe7a3;white-space:nowrap;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.28)}
    .v2-gift-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
    .v2-gift-stat{border:1px solid var(--line);background:#0b1220;border-radius:8px;padding:9px;text-align:center}
    .v2-gift-stat strong{display:block;font-size:20px;color:#fff}
    .v2-gift-stat span{display:block;margin-top:2px;font-size:12px;color:var(--muted)}
    .v2-machine{display:grid;gap:16px;align-items:stretch;justify-content:center;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));min-width:0;min-height:0}
    .v2-slot{position:relative;display:flex;align-items:center;justify-content:center;min-width:0;min-height:130px;border-radius:8px;border:1px solid rgba(255,209,102,.45);background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.04));box-shadow:inset 0 0 40px rgba(255,209,102,.08),0 18px 50px rgba(0,0,0,.28);overflow:hidden}
    .v2-slot::before,.v2-slot::after{content:"";position:absolute;left:0;right:0;height:34%;z-index:1;pointer-events:none}
    .v2-slot::before{top:0;background:linear-gradient(180deg,rgba(0,0,0,.65),transparent)}
    .v2-slot::after{bottom:0;background:linear-gradient(0deg,rgba(0,0,0,.65),transparent)}
    .v2-name{position:relative;z-index:2;text-align:center;width:100%;max-width:100%;max-height:100%;padding:10px 14px;overflow:hidden}
    .v2-name strong{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;word-break:break-word;font-size:clamp(34px,5vw,92px);line-height:1.05}
    .v2-name span{display:block;max-width:100%;margin-top:8px;font-size:clamp(18px,2vw,34px);line-height:1.12;color:#d9e6ff;white-space:nowrap;overflow:hidden}
    .v2-name span:empty{display:none}
    .v2-name .v2-code{margin-top:5px;color:#ffe7a3}
    .v2-slot.spinning .v2-name{animation:v2SlotPulse .2s linear infinite}
    .v2-slot.revealed{animation:v2WinnerSettle .32s ease-out both;border-color:var(--gold)}
    .v2-slot.revealed.quiet{animation:none}
    .v2-footer{display:flex;align-items:center;justify-content:space-between;color:#dbeafe;font-size:clamp(16px,1.5vw,26px)}
    .v2-history{width:100%;border-collapse:collapse;font-size:13px}
    .v2-history th,.v2-history td{border-bottom:1px solid rgba(255,255,255,.08);padding:7px;text-align:left}
    .v2-history th{color:var(--muted)}
    @keyframes v2SlotPulse{from{transform:translateY(-2px);filter:blur(.2px)}to{transform:translateY(2px);filter:blur(.7px)}}
    @keyframes v2WinnerSettle{0%{transform:scale(.97);filter:brightness(.85)}100%{transform:scale(1);filter:brightness(1.08)}}
    @keyframes v2WinnerPop{0%{transform:scale(.97);filter:brightness(.85)}100%{transform:scale(1);filter:brightness(1.08)}}
    @keyframes v2LeverPull{0%{transform:translateY(0) rotate(-8deg)}10%{transform:translateY(-4px) rotate(-10deg)}34%{transform:translateY(88px) rotate(7deg)}48%{transform:translateY(80px) rotate(4deg)}62%{transform:translateY(86px) rotate(6deg)}76%{transform:translateY(72px) rotate(3deg)}90%{transform:translateY(8px) rotate(-6deg)}97%{transform:translateY(-3px) rotate(-9deg)}100%{transform:translateY(0) rotate(-8deg)}}
    @keyframes v2LeverKnob{0%,100%{transform:translateX(-50%) scale(1)}10%{transform:translateX(-50%) scale(1.04,.96)}34%{transform:translateX(-50%) scale(.94,1.07)}58%{transform:translateX(-50%) scale(.98,1.02)}88%{transform:translateX(-50%) scale(1.03,.97)}}
    @keyframes v2LeverBody{0%,100%{transform:translateY(-50%)}34%{transform:translateY(calc(-50% + 2px))}48%{transform:translateY(calc(-50% - 1px))}62%{transform:translateY(calc(-50% + 1px))}}
    @keyframes v2LeverRailLight{0%{top:14px;opacity:.5}34%,70%{top:110px;opacity:.95}100%{top:14px;opacity:.5}}
    .v2-lever{right:12px;top:45%;width:72px;height:310px;background:url("./assets/lever/lever-01.png") center/contain no-repeat;filter:drop-shadow(0 20px 24px rgba(0,0,0,.52));transform:translateY(-50%)}
    .v2-lever::before,.v2-lever-rail,.v2-lever-arm,.v2-lever-base{display:none}
    .v2-stage.is-spinning .v2-lever,.v2-stage.is-lever-pull .v2-lever{animation:v2LeverFrames 3s linear both}
    .v2-stage.is-spinning .v2-lever-arm,.v2-stage.is-lever-pull .v2-lever-arm,.v2-stage.is-spinning .v2-lever-knob,.v2-stage.is-lever-pull .v2-lever-knob,.v2-stage.is-spinning .v2-lever-rail::after,.v2-stage.is-lever-pull .v2-lever-rail::after{animation:none}
    @keyframes v2LeverFrames{
      0%,7%{background-image:url("./assets/lever/lever-01.png")}
      12%,19%{background-image:url("./assets/lever/lever-02.png")}
      24%,31%{background-image:url("./assets/lever/lever-03.png")}
      36%,39%{background-image:url("./assets/lever/lever-04.png")}
      40%,90%{background-image:url("./assets/lever/lever-05.png")}
      94%{background-image:url("./assets/lever/lever-04.png")}
      97%{background-image:url("./assets/lever/lever-03.png")}
      99%{background-image:url("./assets/lever/lever-02.png")}
      100%{background-image:url("./assets/lever/lever-01.png")}
    }
    .v2-poll-results-list{display:flex;flex-direction:column;flex-wrap:nowrap;justify-content:center;align-items:stretch;gap:10px}
    .v2-poll-results-list .v2-poll-card{width:100%;min-height:72px;display:grid;grid-template-columns:minmax(120px,.38fr) minmax(0,1fr);align-items:center;gap:14px;padding:12px 14px}
    .v2-poll-results-list .v2-poll-label{text-align:left;font-size:clamp(18px,2vw,34px)}
    .v2-poll-results-list .v2-poll-crown{display:inline-block;margin-left:.45em;color:var(--gold);filter:drop-shadow(0 0 8px rgba(255,209,102,.5));vertical-align:middle}
    .v2-poll-results-list .v2-poll-track{height:clamp(22px,4vh,44px)}
    .v2-poll-results-list .v2-poll-fill{width:0%}
    .v2-poll-results-list .v2-poll-card.revealed:not(.fresh) .v2-poll-fill{width:var(--target-width,0%)}
    .v2-poll-results-list .v2-poll-card.fresh .v2-poll-fill{animation:v2PollBarReveal .82s cubic-bezier(.2,.78,.22,1) forwards}
    .v2-poll-results-list .v2-poll-count{display:none}
    @keyframes v2PollBarReveal{from{width:0%}to{width:var(--target-width,0%)}}
    .v2-stage.is-brand-hidden .v2-brand{display:none!important}
    .v2-stage.is-brand-hidden .v2-stage-content{grid-template-rows:minmax(0,1fr) 70px;padding-top:24px;padding-bottom:24px;align-items:center}
    .v2-stage.is-brand-hidden .v2-stage-content>div:nth-child(2){align-self:center}
    @media(max-width:980px){body{height:auto;min-height:100vh;overflow:auto}.v2-shell{grid-template-columns:1fr;height:auto}.v2-control{height:auto;max-height:none;border-right:0;border-bottom:1px solid var(--line)}.v2-stage-wrap{height:auto;min-height:60vh}.v2-stage{width:100%;max-height:none}.v2-stage-content{padding:18px;grid-template-rows:80px 1fr 70px}.v2-brand{grid-template-columns:130px 1fr}.v2-machine{grid-template-columns:1fr!important}}
  </style>
</head>
<body>
  <div class="v2-shell">
    <aside class="v2-control">
      <section class="v2-panel">
        <h1 class="v2-title">Lucky Draw V2</h1>
        <p class="v2-sub">Separate test control. Original draw data is not changed.</p>
      </section>

      <section class="v2-panel">
        <div class="v2-field">
          <span>Public screen</span>
          <a id="v2PublicLink" class="v2-public-link" href="#" target="_blank" rel="noopener"></a>
        </div>
        <div class="v2-row">
          <button id="v2OpenPublic" class="v2-btn">Open Public</button>
          <button id="v2CopyPublic" class="v2-btn">Copy Link</button>
        </div>
      </section>

      <section class="v2-panel">
        <div class="v2-field">
          <span>Draw mode</span>
          <select id="v2Mode">
            <option value="main">Main draw - exclude existing winners</option>
            <option value="extra">Extra round - allow original winners</option>
          </select>
        </div>
        <div class="v2-field">
          <span>Prize</span>
          <select id="v2Prize"></select>
        </div>
        <div id="v2GiftStats" class="v2-gift-stats"></div>
        <div class="v2-grid">
          <label class="v2-field"><span>Batch size</span><input id="v2Batch" type="number" min="1" max="10" value="1"></label>
          <label class="v2-field"><span>Extra round name</span><input id="v2RoundName" value="Extra Round"></label>
        </div>
        <label class="v2-check"><input id="v2AllowRepeat" type="checkbox"> Allow repeat inside same extra round</label>
      </section>

      <section class="v2-panel">
        <div class="v2-actions">
          <button id="v2ShowReady" class="v2-btn">Show Ready</button>
          <button id="v2ShowScene" class="v2-btn gold">Show Lucky Draw Scene</button>
          <button id="v2Draw" class="v2-btn primary">Start Draw</button>
          <button id="v2Instant" class="v2-btn gold">Instant Draw</button>
          <button id="v2Redraw" class="v2-btn">Redraw Batch</button>
          <button id="v2Reroll" class="v2-btn">Reroll Selected</button>
          <button id="v2Undo" class="v2-btn danger">Undo Last</button>
          <button id="v2Clear" class="v2-btn">Clear Public</button>
          <button id="v2Export" class="v2-btn">Export CSV</button>
        </div>
      </section>

      <section class="v2-panel">
        <div id="v2Status" class="v2-status">Loading...</div>
      </section>

      <section class="v2-panel">
        <h2 class="v2-sub">Recent V2 saves</h2>
        <div id="v2History"></div>
      </section>
    </aside>

    <main class="v2-stage-wrap">
      <section class="v2-stage" id="v2Stage">
        <div class="v2-stage-bg" id="v2StageBg"></div>
        <div class="v2-stage-dim"></div>
        <div class="v2-lever" aria-hidden="true"><div class="v2-lever-rail"></div><div class="v2-lever-arm"><div class="v2-lever-knob"></div></div><div class="v2-lever-base"></div></div>
        <div class="v2-stage-content">
          <div class="v2-brand">
            <div class="v2-logo" id="v2Logo"></div>
            <div class="v2-banner" id="v2Banner"></div>
          </div>
          <div>
            <div class="v2-prize"><span id="v2ModeLabel" class="v2-mode-pill">V2</span><span id="v2PrizeName">Ready</span><span id="v2GiftLeft" class="v2-gift-left">Available --</span></div>
            <div id="v2Machine" class="v2-machine"></div>
          </div>
          <div class="v2-footer"><span id="v2EventName">Event</span><span id="v2StageStatus">Waiting</span></div>
        </div>
      </section>
    </main>
  </div>
  <script type="module" src="./src/lucky_v2_control.js?v=20260709a"></script>
</body>
</html>
